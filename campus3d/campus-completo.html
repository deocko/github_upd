<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus UPD 3D — Recorrido completo</title>
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:auto}
  html,body{margin:0;background:#0a1420;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  body{overflow-x:hidden}
  body.locked{overflow:hidden}
  #gl{position:fixed;inset:0;display:block;touch-action:pan-y;cursor:grab;z-index:0}
  #gl.drag{cursor:grabbing}
  #scrollspace{position:relative;width:1px;pointer-events:none;visibility:hidden}

  /* ── encabezado ── */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;
    justify-content:space-between;padding:14px 22px;pointer-events:none}
  #topbar .logo{color:#eaf3fb;font-weight:800;font-size:19px;letter-spacing:.02em;
    text-shadow:0 2px 14px rgba(4,10,20,.8);pointer-events:auto}
  #topbar .logo b{color:#e8c86a}
  #topbar .cta{pointer-events:auto;background:linear-gradient(180deg,#e8c86a,#c9a84c);color:#1a130a;
    border:0;padding:10px 20px;border-radius:11px;font:600 13.5px/1 'Inter',sans-serif;cursor:pointer;
    box-shadow:0 8px 24px rgba(201,168,76,.35),inset 0 0 0 1px rgba(255,240,200,.5)}
  #topbar .cta:hover{transform:translateY(-1px)}

  /* ── paneles de capítulo ── */
  .panel{position:fixed;top:50%;transform:translateY(-50%);z-index:6;max-width:390px;width:calc(100vw - 44px);
    opacity:0;visibility:hidden;transition:opacity .45s ease,transform .45s ease;pointer-events:none}
  .panel.show{opacity:1;visibility:visible;pointer-events:auto}
  .panel[data-side="right"]{right:4.5vw}
  .panel[data-side="left"]{left:4.5vw}
  .panel[data-side="center"]{left:50%;transform:translate(-50%,-50%)}
  .panel .card{background:rgba(10,20,34,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(130,180,230,.28);border-radius:16px;padding:22px 24px;
    box-shadow:0 18px 50px rgba(4,10,20,.55)}
  .panel .eyebrow{color:#e8c86a;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .panel h2{color:#eef5fc;font-size:clamp(1.2rem,2.1vw,1.65rem);line-height:1.22;margin:.45rem 0 .55rem;
    letter-spacing:-.015em}
  .panel p{color:#b9cde2;font-size:13.8px;line-height:1.55;margin:0}
  .panel .row{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
  .panel .btn{border:0;border-radius:10px;padding:10px 18px;font:600 13px 'Inter',sans-serif;cursor:pointer}
  .panel .btn-gold{background:linear-gradient(180deg,#e8c86a,#c9a84c);color:#1a130a;
    box-shadow:0 8px 22px rgba(201,168,76,.3)}
  .panel .btn-ghost{background:rgba(255,255,255,.07);color:#eaf3fb;border:1px solid rgba(130,180,230,.35)}
  .panel .btn:hover{filter:brightness(1.08)}

  /* ── riel de capítulos ── */
  #rail{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:7;display:flex;
    flex-direction:column;gap:9px}
  #rail button{width:10px;height:10px;border-radius:50%;border:1px solid rgba(200,220,240,.5);
    background:transparent;cursor:pointer;padding:0;transition:background .25s,transform .25s}
  #rail button.on{background:#e8c86a;border-color:#e8c86a;transform:scale(1.25)}
  #rail button:hover{background:rgba(232,200,106,.5)}

  /* ── pista de scroll ── */
  #hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;color:#cfe0f2;
    font-size:12.5px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:5px;
    opacity:.85;transition:opacity .5s;pointer-events:none;text-shadow:0 2px 10px rgba(4,10,20,.8)}
  #hint.off{opacity:0}
  #hint .chev{width:10px;height:10px;border-right:2px solid #e8c86a;border-bottom:2px solid #e8c86a;
    transform:rotate(45deg);animation:chev 1.6s ease-in-out infinite}
  @keyframes chev{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5}
    50%{transform:rotate(45deg) translate(4px,4px);opacity:1}}

  /* ── entrar / interior ── */
  #freeBtn{position:fixed;left:18px;bottom:18px;z-index:7;background:rgba(10,20,34,.62);
    backdrop-filter:blur(8px);color:#eaf3fb;border:1px solid rgba(130,180,230,.4);
    padding:11px 18px;border-radius:11px;font:600 13px 'Inter',sans-serif;cursor:pointer;
    transition:background .2s}
  #freeBtn:hover{background:rgba(30,50,74,.8)}
  #freeBtn.on{background:linear-gradient(180deg,#e8c86a,#c9a84c);color:#1a130a;border-color:transparent}
  #enterBtn{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:6;
    background:linear-gradient(180deg,#e8c86a,#c9a84c);color:#1a130a;border:0;
    padding:13px 28px;border-radius:12px;font:600 15px/1 'Inter',sans-serif;cursor:pointer;
    box-shadow:0 10px 30px rgba(201,168,76,.4),inset 0 0 0 1px rgba(255,240,200,.5);
    opacity:0;pointer-events:none;transition:opacity .5s,transform .2s}
  #enterBtn.show{opacity:1;pointer-events:auto}
  #enterBtn:hover{transform:translateX(-50%) translateY(-2px)}
  #fade{position:fixed;inset:0;background:#0a1420;opacity:0;pointer-events:none;z-index:9}
  #interior{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:5vw;opacity:0;visibility:hidden;transition:opacity .8s;overflow:auto;
    background:radial-gradient(120% 100% at 50% 0%,#132741,#0a1420 72%);color:#eaf3fb}
  #interior.show{opacity:1;visibility:visible}
  #interior .wrap{max-width:920px;width:100%}
  #interior .ihead{font-size:clamp(1.6rem,3vw,2.5rem);font-weight:700;letter-spacing:-.02em}
  #interior .ihead b{color:#e8c86a}
  #interior .isub{color:#9fc3e6;margin:.5rem 0 1.7rem;font-size:15px;max-width:62ch;line-height:1.55}
  #interior .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  #interior .card{background:rgba(255,255,255,.05);border:1px solid rgba(130,180,230,.22);
    border-radius:14px;padding:18px;cursor:pointer;transition:background .2s,transform .2s}
  #interior .card:hover{background:rgba(255,255,255,.1);transform:translateY(-3px)}
  #interior .card .ic{font-size:24px}
  #interior .card h3{margin:.5rem 0 .25rem;font-size:16px;font-weight:600}
  #interior .card p{margin:0;color:#9fc3e6;font-size:13px;line-height:1.45}
  #interior a.card{display:block;text-decoration:none;color:inherit}
  #interior .card.cv{border-color:rgba(232,200,106,.5);background:rgba(232,200,106,.06)}
  #interior .card.cv:hover{background:rgba(232,200,106,.13)}
  #interior .card .go{display:inline-block;margin-top:10px;color:#e8c86a;font-size:12px;
    font-weight:600;letter-spacing:.04em}
  #exitBtn{margin-top:24px;background:transparent;color:#eaf3fb;border:1px solid rgba(130,180,230,.4);
    padding:11px 22px;border-radius:11px;font:500 14px 'Inter',sans-serif;cursor:pointer}
  #exitBtn:hover{background:rgba(255,255,255,.08)}

  #err{position:fixed;inset:0;display:none;place-items:center;color:#dbe8f5;
    font-size:17px;text-align:center;padding:40px;z-index:12}
  #perf{position:fixed;left:14px;top:64px;z-index:11;display:none;color:#9fe6b8;
    font:600 12px/1.5 Consolas,monospace;background:rgba(6,12,22,.72);padding:8px 12px;border-radius:8px}

  @media(max-width:760px){
    .panel{top:auto;bottom:64px;transform:none;left:16px !important;right:16px !important;max-width:none}
    .panel[data-side="center"]{transform:none}
    .panel .card{padding:17px 18px}
    #rail{right:9px;gap:7px}
    #topbar .cta{padding:9px 15px;font-size:12.5px}
  }
  @media(prefers-reduced-motion:reduce){#hint .chev{animation:none}}
</style>

<canvas id="gl"></canvas>
<div id="scrollspace" aria-hidden="true"></div>

<header id="topbar">
  <span class="logo">UPD<b>.</b> <span style="font-weight:500;font-size:13px;color:#9fc3e6">Campus 3D</span></span>
  <button class="cta" type="button" onclick="location.hash='#final'">Solicitar informes</button>
</header>

<div id="panels"></div>
<nav id="rail" aria-label="Capítulos del recorrido"></nav>
<div id="hint" aria-hidden="true"><span>Desliza para recorrer · arrastra para girar · clic derecho para moverte · clic en un edificio para entrar</span><div class="chev"></div></div>

<button id="freeBtn" type="button" title="Orbita 360° sin centro fijo: rueda para acercarte, clic derecho o dos dedos para moverte por todo el campus, clic en un edificio para entrar">🧭 Vista libre</button>
<button id="enterBtn" type="button">Entrar ›</button>
<div id="fade"></div>
<div id="interior">
  <div class="wrap">
    <div class="ihead" id="intTitle">Edificio · <b>Servicios</b></div>
    <p class="isub" id="intSub"></p>
    <div class="grid" id="intGrid"></div>
    <button id="exitBtn" type="button">‹ Salir del edificio</button>
  </div>
</div>
<div id="err">Tu navegador no pudo iniciar WebGL.</div>
<div id="perf"></div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ═══════════ HORA REAL DE QUERÉTARO → preset de cielo/luz ═══════════
     La escena ya no es siempre atardecer: al cargar se lee la hora local de
     Querétaro (America/Mexico_City) y se interpola entre 4 fases. Forzar con ?hora=N
     (ej. ?hora=12 día, ?hora=18.5 atardecer clásico, ?hora=23 noche). */
  var HQ = (function () {
    var m = /[?&]hora=([\d.]+)/.exec(location.search);
    if (m) return Math.min(24, parseFloat(m[1]));
    try {
      var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Mexico_City', hour12: false, hour: 'numeric', minute: 'numeric' }).formatToParts(new Date());
      var h = 0, mi = 0;
      parts.forEach(function (q) { if (q.type === 'hour') h = +q.value; if (q.type === 'minute') mi = +q.value; });
      return (h % 24) + mi / 60;
    } catch (e) { return 18.5; }
  })();
  // fases y mezcla lineal en las fronteras (cada preset: colores en espacio lineal aprox)
  var FASES = {
    dia:       { top: [.20, .42, .78], mid: [.55, .70, .92], hor: [.85, .90, 1.0], sunC: [1.2, 1.15, 1.0], sunPow: 300,
                 sunInt: 3.1, fillInt: .5, warmInt: .15, hemiInt: .95, ambInt: .45, fog: [.62, .72, .84], fogMul: .42,
                 emis: .22, lightScale: 0, expo: 1.04, bloomTh: 1.35, cloudA: .8, cloudC: [1, 1, 1] },
    atardecer: { top: [.04, .09, .20], mid: [.16, .22, .36], hor: [.95, .55, .32], sunC: [1.3, .75, .42], sunPow: 180,
                 sunInt: 2.7, fillInt: .36, warmInt: .5, hemiInt: .42, ambInt: .22, fog: [.10, .17, .25], fogMul: 1,
                 emis: 1, lightScale: 1, expo: 1, bloomTh: 1, cloudA: .45, cloudC: [1, .72, .55] },
    amanecer:  { top: [.07, .11, .24], mid: [.26, .29, .42], hor: [1.0, .62, .45], sunC: [1.3, .85, .55], sunPow: 200,
                 sunInt: 2.3, fillInt: .4, warmInt: .4, hemiInt: .55, ambInt: .3, fog: [.19, .26, .35], fogMul: .9,
                 emis: .6, lightScale: .5, expo: 1, bloomTh: 1.1, cloudA: .55, cloudC: [1, .8, .7] },
    noche:     { top: [.008, .018, .05], mid: [.025, .045, .095], hor: [.07, .09, .15], sunC: [.5, .6, .85], sunPow: 700,
                 sunInt: .55, fillInt: .22, warmInt: 0, hemiInt: .2, ambInt: .13, fog: [.03, .05, .09], fogMul: 1.05,
                 emis: 1.2, lightScale: 1.25, expo: .92, bloomTh: .95, cloudA: .28, cloudC: [.3, .36, .48] }
  };
  function mezclaFase(h) {
    // noche 20.5–6 · amanecer 6–8.5 · día 8.5–17.5 · atardecer 17.5–20.5 (bordes con blend de 1 h)
    function mix(a, b, t) {
      var o = {};
      Object.keys(a).forEach(function (k) {
        o[k] = Array.isArray(a[k]) ? a[k].map(function (v, i) { return v + (b[k][i] - v) * t; })
                                   : a[k] + (b[k] - a[k]) * t;
      });
      return o;
    }
    var F = FASES;
    if (h < 5.5) return F.noche;
    if (h < 6.5) return mix(F.noche, F.amanecer, h - 5.5);
    if (h < 8) return F.amanecer;
    if (h < 9) return mix(F.amanecer, F.dia, h - 8);
    if (h < 17) return F.dia;
    if (h < 18) return mix(F.dia, F.atardecer, h - 17);
    if (h < 20) return F.atardecer;
    if (h < 21) return mix(F.atardecer, F.noche, h - 20);
    return F.noche;
  }
  var PRESET = mezclaFase(HQ);
  // dirección del sol por hora (este→oeste, corrida al norte como el atardecer original);
  // de noche, "luna" fija fría
  var SUNDIR = (function () {
    if (HQ < 6.2 || HQ > 19.9) return new THREE.Vector3(.32, .58, -.42).normalize();
    var f = (HQ - 6.2) / 13.7;
    var el = .14 + Math.sin(Math.PI * f) * 1.05;
    var d = new THREE.Vector3(Math.cos(Math.PI * f), 0, -.45);
    d.normalize().multiplyScalar(Math.cos(el)); d.y = Math.sin(el);
    return d.normalize();
  })();
  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' }); }
  catch (e) { document.getElementById('err').style.display = 'grid'; return; }

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = innerWidth < 760;
  var DPR = Math.min(devicePixelRatio || 1, isMobile ? 1.3 : 1.45);  // campus: más geometría, menos píxel
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NoToneMapping;         // el tonemap va en el composite
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

  var W = innerWidth, H = innerHeight;

  /* ═══════════ pipeline: escena HDR → bright → blur → composite ═══════════ */
  var HALF = THREE.HalfFloatType;
  function rt(w, h) {
    return new THREE.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), {
      type: HALF, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      colorSpace: THREE.NoColorSpace, depthBuffer: false
    });
  }
  var rtScene, rtBright, rtA, rtB, sceneDepth;
  function makeTargets() {
    var pw = Math.floor(W * DPR), ph = Math.floor(H * DPR);
    rtScene = new THREE.WebGLRenderTarget(pw, ph, {
      type: HALF, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      colorSpace: THREE.NoColorSpace
    });
    rtScene.depthTexture = null;
    var bw = Math.floor(pw / 2), bh = Math.floor(ph / 2);
    rtBright = rt(bw, bh); rtA = rt(bw, bh); rtB = rt(bw, bh);
  }
  makeTargets();

  var quadScene = new THREE.Scene();
  var quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  quad.frustumCulled = false;
  quadScene.add(quad);
  function runPass(mat, target) {
    quad.material = mat;
    renderer.setRenderTarget(target || null);
    renderer.render(quadScene, quadCam);
  }

  var brightMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, threshold: { value: 1.25 }, soft: { value: .5 } },
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:
      'uniform sampler2D tDiffuse;uniform float threshold,soft;varying vec2 vUv;' +
      'void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.2126,.7152,.0722));' +
      'float k=smoothstep(threshold-soft,threshold+soft,l);gl_FragColor=vec4(c*k,1.);}'
  });
  var blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, dir: { value: new THREE.Vector2() } },
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:
      'uniform sampler2D tDiffuse;uniform vec2 dir;varying vec2 vUv;' +
      'void main(){vec3 s=vec3(0.);' +
      's+=texture2D(tDiffuse,vUv+dir*-4.).rgb*.051;' +
      's+=texture2D(tDiffuse,vUv+dir*-3.).rgb*.0918;' +
      's+=texture2D(tDiffuse,vUv+dir*-2.).rgb*.1231;' +
      's+=texture2D(tDiffuse,vUv+dir*-1.).rgb*.1531;' +
      's+=texture2D(tDiffuse,vUv).rgb*.1633;' +
      's+=texture2D(tDiffuse,vUv+dir*1.).rgb*.1531;' +
      's+=texture2D(tDiffuse,vUv+dir*2.).rgb*.1231;' +
      's+=texture2D(tDiffuse,vUv+dir*3.).rgb*.0918;' +
      's+=texture2D(tDiffuse,vUv+dir*4.).rgb*.051;' +
      'gl_FragColor=vec4(s,1.);}'
  });
  var compMat = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: null }, tBloom: { value: null },
      bloomStrength: { value: .82 }, exposure: { value: .96 * (typeof PRESET !== 'undefined' ? PRESET.expo : 1) }, vignette: { value: .34 }
    },
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:
      'uniform sampler2D tScene,tBloom;uniform float bloomStrength,exposure,vignette;varying vec2 vUv;' +
      'vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}' +
      'void main(){vec3 c=texture2D(tScene,vUv).rgb;' +
      'c+=texture2D(tBloom,vUv).rgb*bloomStrength;' +
      'c*=exposure;' +
      'c=aces(c);' +
      // grado sutil hacia cian en sombras / cálido en luces
      'c=mix(c,c*vec3(.96,1.0,1.06),.25);' +
      'float d=distance(vUv,vec2(.5));c*=1.-vignette*smoothstep(.35,.85,d);' +
      'c=pow(c,vec3(1./2.2));' +
      'gl_FragColor=vec4(c,1.);}'
  });

  /* ═══════════ escena ═══════════ */
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(new THREE.Color(PRESET.fog[0], PRESET.fog[1], PRESET.fog[2]), 0.0052 * PRESET.fogMul);

  var NAVY = 0x0d1b2e, GOLD = 0xc9a84c, GOLD_W = 0xe8c86a;

  /* env-map + cielo: MISMO shader parametrizado por el PRESET de la hora */
  function skyFrag() {
    return 'varying vec3 vP;uniform vec3 uTop,uMid,uHor,uSunD,uSunC;uniform float uPow;' +
      'void main(){vec3 d=normalize(vP);float h=d.y;' +
      'vec3 c=mix(uMid,uTop,smoothstep(0.,.55,h));' +
      'c=mix(c,uHor,clamp(exp(-max(h,0.)*6.)-max(-h,0.)*2.,0.,1.));' +
      'float s=max(0.,dot(d,uSunD));' +
      'c+=uSunC*pow(s,uPow)*1.1;' +                     // disco solar / luna
      'c+=uSunC*.3*pow(s,10.)*.8;' +                    // resplandor
      'gl_FragColor=vec4(c,1.);}';
  }
  function skyUniforms() {
    return {
      uTop: { value: new THREE.Vector3().fromArray(PRESET.top) },
      uMid: { value: new THREE.Vector3().fromArray(PRESET.mid) },
      uHor: { value: new THREE.Vector3().fromArray(PRESET.hor) },
      uSunD: { value: SUNDIR.clone() },
      uSunC: { value: new THREE.Vector3().fromArray(PRESET.sunC) },
      uPow: { value: PRESET.sunPow }
    };
  }
  var skyVert = 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
  (function () {
    var env = new THREE.Scene();
    var m = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: skyUniforms(), vertexShader: skyVert, fragmentShader: skyFrag() });
    env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 16), m));
    var pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, 0.02).texture;
    pmrem.dispose();
  })();
  var sky = new THREE.Mesh(new THREE.SphereGeometry(760, 32, 18),
    new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: skyUniforms(), vertexShader: skyVert, fragmentShader: skyFrag() }));
  scene.add(sky);

  /* ═══════════ luces (intensidades/colores por PRESET) ═══════════ */
  scene.add(new THREE.HemisphereLight(0x3a4759, 0x2a2016, PRESET.hemiInt));
  scene.add(new THREE.AmbientLight(0x2c3340, PRESET.ambInt));
  var sun = new THREE.DirectionalLight(new THREE.Color(PRESET.sunC[0], PRESET.sunC[1], PRESET.sunC[2]).multiplyScalar(.85), PRESET.sunInt);
  sun.position.copy(SUNDIR).multiplyScalar(130);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 4; sun.shadow.camera.far = 320;
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = .8; sun.shadow.radius = 6;
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0x82909e, PRESET.fillInt);   // relleno frío tenue
  fill.position.set(60, 40, 55);
  scene.add(fill);

                       freeTgt.z + Math.cos(azF) * Math.cos(elF) * distF);
      cam.lookAt(freeTgt);
      camPos.copy(cam.position); camTgt.copy(freeTgt);
      scene.fog.density = (.0030 + (.0016 - .0030) * Math.max(0, Math.min(1, (camPos.y - 34) / 120))) * PRESET.fogMul;
    } else if (state === 'entering' || state === 'exiting') {
      var dur = state === 'entering' ? ENTER_DUR : EXIT_DUR;
      var u = Math.min(1, (now - tT0) / dur), es = u * u * (3 - 2 * u);
      if (DBG_STAY && state === 'entering') { u = Math.min(u, .999); es = Math.min(es, .62); }  // depuración: congelar frente a la puerta
      var k = state === 'entering' ? es : 1 - es;
      cam.position.lerpVectors(savedPos, doorPosW, k);
      V3a.lerpVectors(savedTgt, doorTgtW, k);
      cam.lookAt(V3a);
      var dd = CAMPUS[enterKey].doors;
      dd.open = Math.max(0, Math.min(1, (k - .2) / .6));
      fadeEl.style.opacity = Math.max(0, Math.min(1, (k - .68) / .32));
      if (u >= 1) {
        if (state === 'entering') { state = 'inside'; interiorEl.classList.add('show'); }
        else {
          state = prevMode; fadeEl.style.opacity = 0; enterKey = null;
          if (prevMode === 'free') {
            document.body.classList.add('locked');       // la vista libre mantiene el scroll bloqueado
          } else {
            document.body.classList.remove('locked');
            setChapter(activeIdx >= 0 ? activeIdx : 0);
          }
        }
      }
    }

    // puertas (todas: solo la activa se mueve)
    Object.keys(CAMPUS).forEach(function (k) {
      var d = CAMPUS[k].doors;
      if (!d.L) return;
      var od = d.open * 2.5;
      d.L.position.x = d.baseL - od; d.R.position.x = d.baseR + od;
      d.L.updateMatrix(); d.R.updateMatrix();
    });

    // crossfade del pool de luces (320 ms)
    if (poolT0 >= 0) {
      var lu = Math.min(1, (now - poolT0) / 320);
      for (var li = 0; li < POOL_N; li++) pool[li].intensity = poolFrom[li] + (poolTo[li] - poolFrom[li]) * lu;
      if (lu >= 1) poolT0 = -1;
    }

    // hologramas
    for (var hi = 0; hi < HOLOS.length; hi++) {
      var h = HOLOS[hi];
      h.emblem.getWorldPosition(V3b);
      h.emblem.lookAt(cam.position.x, V3b.y, cam.position.z);
      h.emblem.position.y = Math.sin(t * 1.3 + hi) * .22;
      for (var ri = 0; ri < 3; ri++) { h.rings[ri].rotation.z += .006 * (ri + 1); h.rings[ri].rotation.y += .004; }
    }

    // autos por el anillo + NPCs por los andadores + deriva de nubes
    var dtv = Math.min(.06, t - lastAnimT); lastAnimT = t;
    if (!reduced) {
      for (var ci2 = 0; ci2 < CARS.length; ci2++) {
        var cr = CARS[ci2];
        cr.s = (cr.s + cr.v * dtv * 8 * cr.dir + 1) % 1;
        var pp = cr.fn(cr.dir > 0 ? cr.s : 1 - cr.s, cr.lado);
        cr.g.position.set(pp.x, .06, pp.z);
        cr.g.rotation.y = (cr.dir > 0 ? pp.hd : pp.hd + Math.PI);
      }
      for (var ni = 0; ni < NPCS.length; ni++) {
        var np = NPCS[ni];
        np.t += np.v * dtv * 60;
        var tt = np.t % 2, k2 = tt < 1 ? tt : 2 - tt;          // ping-pong
        var nx = np.a[0] + (np.b[0] - np.a[0]) * k2, nz = np.a[1] + (np.b[1] - np.a[1]) * k2;
        np.g.position.set(nx, Math.abs(Math.sin(t * 7 + np.ph)) * .05, nz);
        var fw = tt < 1 ? 1 : -1;
        np.g.rotation.y = Math.atan2((np.b[0] - np.a[0]) * fw, (np.b[1] - np.a[1]) * fw);
        np.g.rotation.z = Math.sin(t * 7 + np.ph) * .04;       // vaivén de caminata
      }
      for (var cl2 = 0; cl2 < CLOUDS.length; cl2++) {
        var cd = CLOUDS[cl2];
        cd.position.x += cd.userData.v * dtv * 2;
        if (cd.position.x > 400) cd.position.x = -400;
      }
    }

    // viento en las copas (se apaga en las tomas altas: no se aprecia y cuesta)
    if (!reduced && camPos.y < 90) for (var sw = 0; sw < swayers.length; sw++) {
      var w2 = swayers[sw];
      w2.o.rotation.z = w2.bz + Math.sin(t * .5 + w2.p) * w2.a;
      w2.o.rotation.x = Math.cos(t * .42 + w2.p) * w2.a * .6;
    }

    updateInteriors(now);

    // sombras: solo cuando algo cambió
    if (shadowFrames > 0) { renderer.shadowMap.needsUpdate = true; shadowFrames--; }

    // 1) escena → HDR
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, cam);
    if (showPerf) perfCalls = renderer.info.render.calls;   // antes de los passes de quad
    // 2) bright
    brightMat.uniforms.tDiffuse.value = rtScene.texture;
    runPass(brightMat, rtBright);
    // 3) blur ping-pong
    var bw = rtBright.width, bh = rtBright.height, src = rtBright;
    for (var p = 0; p < 3; p++) {
      blurMat.uniforms.tDiffuse.value = src.texture;
      blurMat.uniforms.dir.value.set(1.4 / bw, 0); runPass(blurMat, rtA);
      blurMat.uniforms.tDiffuse.value = rtA.texture;
      blurMat.uniforms.dir.value.set(0, 1.4 / bh); runPass(blurMat, rtB);
      src = rtB;
    }
    // 4) composite → pantalla
    compMat.uniforms.tScene.value = rtScene.texture;
    compMat.uniforms.tBloom.value = rtB.texture;
    runPass(compMat, null);

    if (showPerf) {
      frames++;
      if (now - fpsT0 > 500) { fps = Math.round(frames * 1000 / (now - fpsT0)); frames = 0; fpsT0 = now; }
      perfEl.textContent = 'fps ' + fps + ' · calls ' + perfCalls + ' · cap ' + activeIdx +
        ' · ' + state + ' · sy ' + Math.round(scrollY) + ' · f ' + (scrollFrac() * (NCH - 1)).toFixed(2);
    }
    requestAnimationFrame(render);
  }
  camPos.fromArray(CHAPS[0].pos); camTgt.fromArray(CHAPS[0].tgt);
  cam.position.copy(camPos); cam.lookAt(camTgt);
  setChapter(0);
  // El recorrido SIEMPRE arranca en la apertura (el navegador restaura el scroll si no).
  // ?cap=N salta directo a un capítulo (depuración y capturas).
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  var capQ = /[?&]cap=(\d+)/.exec(location.search);
  var ci = capQ ? Math.min(NCH - 1, +capQ[1]) : 0;
  var jumps = 0, jump = function () {
    var el = document.getElementById('scrollspace');
    scrollTo(0, ci / (NCH - 1) * (el.offsetHeight - innerHeight));
    if (++jumps < 12) requestAnimationFrame(jump);   // gana a la restauración del navegador
  };
  requestAnimationFrame(jump);
  // ?enter=key: probar el flujo de entrada sin click (depuración); &stay=1 congela el vuelo
  var entQ = /[?&]enter=(\w+)/.exec(location.search);
  if (entQ && CAMPUS[entQ[1]]) setTimeout(function () { startEnter(entQ[1]); }, 2500);
  // ?free=1: arrancar en vista libre (depuración)
  if (/[?&]free=1/.test(location.search)) setTimeout(enterFree, 1500);
  // ?ojo=px,py,pz,tx,ty,tz: cámara fija de inspección (depuración y capturas)
  var ojoQ = /[?&]ojo=([-\d.,]+)/.exec(location.search);
  if (ojoQ) {
    var ov = ojoQ[1].split(',').map(Number);
    state = 'free';
    freeTgt.set(ov[3] || 0, ov[4] || 0, ov[5] || 0);
    var dxo = (ov[0] || 0) - freeTgt.x, dyo = (ov[1] || 0) - freeTgt.y, dzo = (ov[2] || 0) - freeTgt.z;
    var rho = Math.hypot(dxo, dzo);
    azF = azFT = Math.atan2(dxo, dzo);
    elF = elFT = Math.atan2(dyo, Math.max(.01, rho));
    distF = distFT = Math.hypot(rho, dyo);
    document.body.classList.add('locked');
  }
  render();
})();
</script>
